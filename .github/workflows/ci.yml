name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  engine:
    name: Engine (C++) - ${{ matrix.name }}
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: release
            build_type: Release
            cxx_flags: ""
          - name: sanitisers
            build_type: Debug
            cxx_flags: "-fsanitize=address,undefined -fno-omit-frame-pointer -fno-sanitize-recover=all"
    steps:
      - uses: actions/checkout@v4

      - name: Install toolchain
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            cmake ninja-build g++ pkg-config librdkafka-dev nlohmann-json3-dev libgtest-dev

      - name: Configure
        run: >
          cmake -S engine -B build -G Ninja
          -DCMAKE_BUILD_TYPE=${{ matrix.build_type }}
          -DCMAKE_CXX_FLAGS="${{ matrix.cxx_flags }}"

      - name: Build (warnings are errors)
        run: cmake --build build

      - name: Unit tests and CLI scenario test
        run: ctest --test-dir build --output-on-failure

  static-analysis:
    name: Engine (C++) - clang-tidy
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Install toolchain
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            cmake ninja-build g++ pkg-config clang-tidy librdkafka-dev nlohmann-json3-dev libgtest-dev
      - name: Generate compile database
        run: cmake -S engine -B build -G Ninja -DMINIAIR_BUILD_TESTS=OFF
      - name: clang-tidy (findings are errors)
        run: clang-tidy -p build --quiet engine/src/*.cpp

  ingestion:
    name: Ingestion (Python)
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: ingestion
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: ingestion/requirements-dev.txt
      - run: pip install -r requirements-dev.txt
      - name: Lint
        run: |
          ruff check .
          ruff format --check .
      - name: Unit tests
        run: pytest -q

  system-test:
    name: System test (Docker Compose + Kafka)
    needs: [engine, ingestion]
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Run full stack and check alerts
        run: ./tests/integration/run.sh
      - name: Keep alert output
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: system-test-alerts
          path: tests/integration/alerts.jsonl
          if-no-files-found: ignore
